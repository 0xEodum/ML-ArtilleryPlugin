# Firing solutions are computed in-process from the exact tick equations of
# the game's projectile physics. No Python, no model files, no network calls.

# Largest launch speed the plugin will use, blocks per tick. Targets that need
# more than this are reported as unreachable rather than fired at blindly.
# For reference, at 45 degrees a target 500 blocks away needs about 8.4 b/t
# with arrows and about 14.2 b/t with TNT.
max-launch-speed: 12.0

# Longest flight the plugin will fire, in ticks (20 ticks = 1 second). Near the
# absolute range limit a projectile creeps toward the target for thousands of
# ticks; such shots are refused rather than fired, since the chunk would unload
# or the entity despawn long before impact.
max-flight-ticks: 600

# Trajectory selection is per weapon, set with the angle: argument of
# /giveartillery. See section 3.8 of the README.

default-max-range: 100
default-projectile-count: 5
default-radius: 3

debug-mode: false

# Projectile physics constants. These defaults are taken from the entity tick
# code and normally need no changes; override them only if a game update or
# another plugin retunes projectile motion.
#
#   gravity              blocks per tick squared, subtracted from vertical speed
#   drag                 fraction of speed lost per tick (terminal = gravity/drag)
#   gravity-before-move  true when the entity applies gravity before moving.
#                        TNT does; arrows, tridents and potions do not, and that
#                        difference alone changes the trajectory noticeably.
physics:
  arrow:
    gravity: 0.05
    drag: 0.01
    gravity-before-move: false
  trident:
    gravity: 0.05
    drag: 0.01
    gravity-before-move: false
  potion:
    gravity: 0.05
    drag: 0.01
    gravity-before-move: false
  tnt:
    gravity: 0.04
    drag: 0.02
    gravity-before-move: true
